<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f6f8fb;
    font-family:Inter,sans-serif;
}

.card{
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
    max-width:500px;
}

h1{
    font-size:72px;
    margin:0;
    color:#7c3aed;
}

p{
    color:#64748b;
    margin:15px 0 25px;
}

a{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}
</style>
</head>

<body>

<div class="card">
    <h1>404</h1>
    <p>The page you are looking for does not exist.</p>

    <a href="/">Go Home</a>
</div>

</body>
</html>
