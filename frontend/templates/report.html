<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AutoCare — Reports</title>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/style/css/user.css">
  <link rel="stylesheet" href="/style/css/report.css">
</head>

<body>
<header class="topbar">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" width="26" height="26">
        <path d="M12 2C10.9 2 10 2.9 10 4v1.2C8.3 5.7 7.2 7.2 7.2 9c0 2.5 2.3 4.2 4.8 4.2S16.8 11.5 16.8 9c0-1.8-1.1-3.3-2.8-3.8V4c0-1.1-.9-2-2-2Z" fill="white"/>
      </svg>
    </div>
    <div class="app-title">
      <strong>AutoCare</strong>
      <div class="sub small">Clinical AI · Risk · Reports</div>
    </div>
  </div>

  <!-- ✅ ROUTE BASED NAVIGATION -->
  <nav class="topnav">
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/dataupload" class="nav-link">Data Upload</a>
    <a href="/advice" class="nav-link">Advice</a>
    <a href="/chat" class="nav-link">Chat</a>
    <a href="/report" class="nav-link active">Reports</a>
  </nav>

  <div class="right-controls">
    <a href="/logout" class="nav-link">Logout</a>
  </div>
</header>

<div class="container">
  <main class="workspace">
    <section aria-label="Reports">
      <div class="card">
        <h2>📄 Health Risk Reports</h2>
        <p class="small muted">
          Generate downloadable reports based on your latest health assessment.
        </p>

        <div class="actions">
          <button class="result-btn" id="genReport">Generate PDF</button>
          <a class="manual-btn" id="dlReport" disabled>Download</a>
        </div>

        <div id="reportPreview">
          <div class="preview-line muted">
            No report generated yet.
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- JS -->
<script src="/style/js/report.js"></script>

<script>
  // Highlight active nav
  document.querySelectorAll('.topnav .nav-link').forEach(link => {
    if (link.getAttribute('href') === location.pathname) {
      link.classList.add('active');
    }
  });
</script>

</body>
</html>
