<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoCare — Manual Entry</title>

  <link rel="stylesheet" href="/style/css/user.css">
  <link rel="stylesheet" href="/style/css/manual.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <strong>AutoCare</strong>
  </div>

  <nav class="topnav">
    <a href="/dashboard">Dashboard</a>
    <a class="active" href="/manual">Manual Entry</a>
    <a href="/dataupload">Data Upload</a>
    <a href="/advice">Advice</a>
    <a href="/chat">Chat</a>
    <a href="/report">Reports</a>
  </nav>
</header>

<div class="container">
  <div class="card">

    <h2>Manual Health Assessment</h2>

    <form id="healthForm" autocomplete="off">

      <!-- BASIC -->
      <h3>Basic Details</h3>

      <label>Gender
        <select id="gender">
          <option value="">Select</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </label>

      <label>Age
        <input type="number" id="age">
      </label>

      <label>Height (cm)
        <input type="number" id="height">
      </label>

      <label>Weight (kg)
        <input type="number" id="weight">
      </label>

      <div id="bmiBox">BMI: —</div>

      <!-- METRICS -->
      <h3>Health Metrics</h3>

      <label>Systolic
        <input type="number" id="systolic">
      </label>

      <label>Diastolic
        <input type="number" id="diastolic">
      </label>

      <label>Sleep (hours)
        <input type="number" id="sleep">
      </label>

      <!-- HISTORY -->
      <h3>Medical History</h3>

      <label><input type="checkbox" id="chk_chest"> Chest pain</label>
      <label><input type="checkbox" id="chk_heart"> Prior heart attack</label>
      <label><input type="checkbox" id="chk_chol"> High cholesterol</label>
      <label><input type="checkbox" id="chk_walk"> Walking difficulty</label>
      <label><input type="checkbox" id="chk_activity"> Physical activity</label>
      <label><input type="checkbox" id="chk_alcohol"> Alcohol</label>
      <label><input type="checkbox" id="smoking"> Smoking</label>

      <label>Stress Level
        <select id="stress">
          <option value="">Select</option>
          <option value="0">No Stress</option>
          <option value="0.5">Mild</option>
          <option value="1">Moderate</option>
          <option value="1.5">High</option>
          <option value="2">Severe</option>
        </select>
      </label>

      <br><br>
      <button type="submit">Submit Assessment</button>

    </form>

    <hr>

    <h3>Live Summary</h3>
    <div id="genEmoji">💖</div>
    <div id="genText">Excellent</div>
    <div id="s_bmi">BMI: —</div>
    <div id="s_bp">BP: —</div>
    <div id="s_alcohol">Alcohol: —</div>

  </div>
</div>

<script src="/style/js/manual.js" defer></script>
</body>
</html>
