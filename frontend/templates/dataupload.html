<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoCare — Data Upload</title>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Global CSS -->
  <link rel="stylesheet" href="/style/css/user.css">
  <link rel="stylesheet" href="/style/css/dataupload.css">
</head>

<body>

  <!-- ================= TOPBAR (EXACT SAME) ================= -->
  <header class="topbar" role="banner">
    <div class="topbar-inner">

      <div class="brand">
        <img src="/static/images/gpt_autocare.png" class="logo-img" />
        <div class="app-title">
          <span class="app-name">AutoCare</span>
          <span class="app-sub">Clinical AI · Risk · Reports</span>
        </div>
      </div>

      <nav class="topnav">
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link active" href="/dataupload">Data Upload</a>
        <a class="nav-link" href="/advice">Advice</a>
        <a class="nav-link" href="/chat">Chat</a>
        <a class="nav-link" href="/report">Reports</a>
      </nav>

      <div class="right-controls">
        <div class="user-info">
          <div class="avatar">PT</div>
          <div class="user-name">Paras</div>
        </div>
      </div>

    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <div class="container">
    <main class="workspace">

      <section class="upload-simple">

        <h1 class="upload-title">Upload Data</h1>
        <p class="upload-sub">
          Choose how you want to provide patient information
        </p>

        <div class="upload-actions">

          <a href="/manual" class="upload-btn primary">
            Fill Patient Data Manually
          </a>

          <a href="/dashboard" class="upload-btn secondary">
            Back to Dashboard
          </a>

        </div>

      </section>

    </main>
  </div>

</body>
</html>
