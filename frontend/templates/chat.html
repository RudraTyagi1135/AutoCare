<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AutoCare — Chat</title>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/style/css/user.css">
  <link rel="stylesheet" href="/style/css/chat.css">
</head>
<body>

  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" width="26" height="26">
          <path d="M12 2C10.8954 2 10 2.89543 10 4V5.2
          C8.34315 5.71159 7.2 7.23903 7.2 9
          C7.2 11.4853 9.51472 13.2 12 13.2
          C14.4853 13.2 16.8 11.4853 16.8 9
          C16.8 7.23903 15.6569 5.71159 14 5.2V4
          C14 2.89543 13.1046 2 12 2Z"
          fill="white"/>
        </svg>
      </div>
      <div class="app-title">
        <strong>AutoCare</strong>
        <div class="sub small">Clinical AI · Risk · Reports</div>
      </div>
    </div>

    <nav class="topnav">
      <a href="/dashboard" class="nav-link">Dashboard</a>
      <a href="/dataupload" class="nav-link">Data Upload</a>
      <a href="/advice" class="nav-link">Advice</a>
      <a href="/chat" class="nav-link active">Chat</a>
      <a href="/report" class="nav-link">Reports</a>
    </nav>
  </header>

  <!-- ================= MAIN ================= -->
  <div class="container">
    <main class="workspace">
      <section class="card">

        <div class="app">

          <!-- Sidebar -->
          <aside class="sidebar">
            <div style="display:flex;justify-content:space-between;">
              <button id="polNewChat" class="new-chat">New chat</button>
            </div>

            <div class="chats" id="polChatList"></div>

            <footer class="small muted">
              Logged in
            </footer>
          </aside>

          <!-- Chat panel -->
          <main class="panel">

            <!-- Messages -->
            <div class="messages" id="polMessages">
              <div class="msg assistant">
                <div class="meta">Assistant</div>
                <div>
                  👋 Hello! I’m AutoCare assistant.
                  Ask me about uploads, predictions, or reports.
                </div>
              </div>
            </div>

            <!-- Composer -->
            <form class="composer" onsubmit="return false;">
              <input 
                type="text" 
                id="polUserInput"
                placeholder="Send a message..." 
              />
              <button 
                type="button" 
                id="polSendBtn"
                class="send-btn">
                Send
              </button>
            </form>

          </main>

        </div>

      </section>
    </main>
  </div>

  <!-- JS -->
  <script src="/style/js/chat.js" defer></script>

</body>
</html>
