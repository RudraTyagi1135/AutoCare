<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AutoCare — Chat</title>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/style/css/user.css">
  <link rel="stylesheet" href="/style/css/chat.css">
</head>
<body>

  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <div class="topbar-inner">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-mark">
          <span class="brand-mark-ac">AC</span>
        </div>
        <div class="app-title">
          <span class="app-name">AutoCare</span>
          <span class="app-sub">Clinical AI · Risk · Reports</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="topnav">
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link" href="/dataupload">Data Upload</a>
        <a class="nav-link" href="/advice">Advice</a>
        <a class="nav-link active" href="/chat">Chat</a>
        <a class="nav-link" href="/report">Reports</a>
      </nav>

      <!-- User Dropdown -->
      <div class="right-controls">
        <details class="user-dropdown">
          <summary class="user-info">
            <div class="avatar">PT</div>
            <div class="user-name">Paras</div>
            <span class="dropdown-caret">▾</span>
          </summary>

          <div class="user-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/dataupload">Data Upload</a>
            <a href="/advice">Advice</a>
            <a href="/chat">Chat</a>
            <a href="/report">Reports</a>
            <div class="menu-divider"></div>
            <a href="/logout" class="danger">Logout</a>
          </div>
        </details>
      </div>

    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <div class="container">
    <main class="workspace">

      <section class="chat-layout">

        <!-- ================= SIDEBAR ================= -->
        <aside id="chatSidebar" class="chat-sidebar">

          <div class="sidebar-top">
            <button id="polNewChat" class="new-chat-btn">+ New Chat</button>
          </div>

          <div id="polChatList" class="chat-history"></div>

        </aside>

        <!-- ================= CHAT ================= -->
        <div class="chat-main">

          <!-- Toggle Sidebar -->
          <button id="toggleSidebar" class="toggle-sidebar">☰</button>

          <!-- Messages -->
          <div id="polMessages" class="chat-messages"></div>

          <!-- Input -->
          <div class="chat-input-area">
            <input id="polUserInput" type="text" placeholder="Send a message..." />
            <button id="polSendBtn">Send</button>
          </div>

        </div>

      </section>

    </main>
  </div>

  <!-- ================= JS ================= -->
  <script>
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.getElementById("chatSidebar");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });
  </script>

  <script src="/style/js/chat.js" defer></script>

</body>
</html>
