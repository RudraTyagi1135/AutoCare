<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AutoCare — Chat</title>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared + section CSS -->
  <link rel="stylesheet" href="css/user.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C10.8954 2 10 2.89543 10 4V5.2C8.34315 5.71159 7.2 7.23903 7.2 9C7.2 11.4853 9.51472 13.2 12 13.2C14.4853 13.2 16.8 11.4853 16.8 9C16.8 7.23903 15.6569 5.71159 14 5.2V4C14 2.89543 13.1046 2 12 2Z" fill="white" opacity="0.95"/>
        </svg>
      </div>
      <div class="app-title"><strong>AutoCare</strong><div class="sub small">Clinical AI · Risk · Reports</div></div>
    </div>

    <nav class="topnav" role="navigation" aria-label="Top navigation">
      <a href="user.html" class="nav-link" data-target="dashboard">Dashboard</a>
      <a href="manual.html" class="nav-link" data-target="upload">Data Upload</a>
      <a href="advice.html" class="nav-link" data-target="advice">Advice</a>
      <a href="chat.html" class="nav-link active" data-target="chat">Chat</a>
      <a href="report.html" class="nav-link" data-target="reports">Reports</a>
    </nav>

    <div class="right-controls">
      <div class="dropdown" style="margin-right:8px; position:relative">
        <button id="settingsToggle" class="icon-btn" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">⚙️</button>
        <div id="settingsMenu" class="dropdown-menu" role="menu" aria-hidden="true">
          <div class="item" data-action="signin">Sign in</div>
          <div class="item" data-action="switch">Switch account</div>
          <div class="item" data-action="signout">Sign out</div>
        </div>
      </div>

      <div class="auth-container" style="position:relative">
        <button id="authBox" class="box-dash" aria-haspopup="true" aria-expanded="false" title="Account">PT</button>
        <div id="authMenu" class="dropdown-menu" role="menu" aria-hidden="true" style="right:0;top:64px">
          <div class="item" data-action="signin">Sign in</div>
          <div class="item" data-action="switch">Switch account</div>
          <div class="item" data-action="signout">Sign out</div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <main class="workspace">
      <!-- Chat section -->
      <section id="chat" class="card" aria-label="Chat">
        <div class="polished-root">
          <div class="app" role="application">
            <aside class="sidebar" aria-label="Conversations">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <button id="polNewChat" class="new-chat">New chat</button>
                <button id="polToggleSidebar" class="icon-btn" aria-pressed="false" title="Toggle conversations">≡</button>
              </div>
              <div id="polChatList" class="chats">
                <div class="chat-item" data-q="Hello">
                  <div class="icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.1"/></svg></div>
                  <div class="title">Hello</div>
                </div>
              </div>
              <footer style="margin-top:auto;font-size:0.86rem;color:var(--muted)">Logged in as <strong>Paras</strong></footer>
            </aside>

            <main class="panel" role="main">
              <div id="polMessages" class="messages" aria-live="polite">
                <div class="msg assistant"><div class="meta">Assistant</div><div>👋 Hello! I'm AutoCare assistant — ask about workflows, uploads, or patient guidance.</div><div class="time">--</div></div>
              </div>
              <form id="polComposer" class="composer" onsubmit="return false;">
                <input id="polUserInput" type="text" placeholder="Send a message..." autocomplete="off" aria-label="Message input"/>
                <button id="polSendBtn" type="button" class="send-btn">Send</button>
              </form>
            </main>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Section JS -->
  <script src="js/chat.js" defer></script>

  <!-- small header helper to toggle dropdowns + mark active nav -->
  <script>
    (function(){
      const navLinks = document.querySelectorAll('.topnav .nav-link');
      const current = location.pathname.split('/').pop() || 'chat.html';
      navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === current));

      const settingsToggle = document.getElementById('settingsToggle');
      const settingsMenu = document.getElementById('settingsMenu');
      const authBox = document.getElementById('authBox');
      const authMenu = document.getElementById('authMenu');

      function toggle(elBtn, elMenu){
        elBtn.addEventListener('click', (e) => {
          const open = elMenu.style.display === 'block';
          elMenu.style.display = open ? 'none' : 'block';
          elBtn.setAttribute('aria-expanded', String(!open));
        });
        document.addEventListener('click', (ev) => {
          if(!elBtn.contains(ev.target) && !elMenu.contains(ev.target)) {
            elMenu.style.display = 'none';
            elBtn.setAttribute('aria-expanded', 'false');
          }
        });
      }
      toggle(settingsToggle, settingsMenu);
      toggle(authBox, authMenu);
    })();
  </script>
</body>
</html>
