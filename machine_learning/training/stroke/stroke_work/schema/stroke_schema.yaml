# ==========================================================
# 🧠 AutoCare Stroke Risk Training Data Schema (FINAL v6)
# ==========================================================

columns:
  age_category: int               # 1–13 encoded age bucket
  gender: object                  # 'Male' or 'Female'
  bmi: float                      # Body Mass Index
  smoking: int                    # 1 = smoker, 0 = non-smoker
  alcohol: int                    # 1 = Yes, 0 = No
  physactivity: int               # 1 = Yes, 0 = No
  sleeptime: int                  # Sleep hours (1–24)
  stress_category: int            # 0–4
  diffwalk: int                   # 1 = Yes, 0 = No
  stroke: int                     # TARGET: 1 = stroke, 0 = healthy

target_column: stroke
